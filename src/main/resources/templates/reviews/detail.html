<!DOCTYPE html>
<html lang="ko" xmlns:sec="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <title>ICHITABI - 당신의 가장 좋았던 일본을 공유해주세요</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/reset.css}" />
    <link rel="stylesheet" th:href="@{/css/common.css}" />
    <link rel="stylesheet" th:href="@{/css/review_detail.css}" />
  </head>

  <body>
    <div id="header" th:insert="~{fragment/header::header}"></div>
    <div id="wrapper" th:object="${reviewDetail}">
      <div id="location">
        <ul>
          <li class="btn-home">
            <a href="/">홈</a>
          </li>
          <li class="seperator">
            <p>&gt;</p>
          </li>
          <li class="location-detail">
            <a href="/">일본 전국</a>
          </li>
          <li class="seperator">
            <p>&gt;</p>
          </li>
          <li class="location-detail">
            <a href="/region/detail/kanto">관동지방</a>
          </li>
          <li class="seperator">
            <p>&gt;</p>
          </li>
          <li class="location-detail">
            <a href="">도쿄도</a>
          </li>
        </ul>
      </div>

      <div id="name" th:text="*{title}"></div>
      <div class="btn-writer">
        <button id="edit-btn" th:if="${isOwner}">수정</button>
        <button id="delete-btn" th:if="${isOwner}">삭제</button>
      </div>

      <div id="main1">
        <div id="star" th:data-rating="*{rating}">
          <p class="star">o</p>
          <p class="star">o</p>
          <p class="star">o</p>
          <p class="star">o</p>
          <p class="star">o</p>
        </div>
        <div id="hashtag" th:if="*{hashtagList != null}" th:each="tag : *{hashtagList}" th:text="|#${tag}|"></div>
      </div>
      <div id="main-img">
        <div class="left">
          <p><img class="photo-left" th:src="${imgUrl?.size() > 0 ? review.imgUrl[0] : '/images/default_review.webp'}"/></p>
        </div>
        <div class="right">
          <p><img class="photo-right1" th:src="${imgUrl?.size() > 1 ? review.imgUrl[1] : '/images/default_review.webp'}"/></p>
          <p><img class="photo-right2" th:src="${imgUrl?.size() > 2 ? review.imgUrl[2] : '/images/default_review.webp'}"/></p>
        </div>
      </div>

      <div id="main2">
        <div class="left">
          <div id="main2-0">
            <p id="avatar"><img src="" alt="아바타이미지" /></p>
            <p id="nick" th:text="*{nickname}"></p>
            <p>님의 추천 장소</p>
          </div>

          <div id="main2-1">
            <p id="gender" th:text="*{genderText}"></p>
            <p id="age"  th:text="|*{age}대|"></p>
          </div>

          <div id="main2-2">
            <p id="period">시기</p>
            <p id="date" th:text="*{date}"></p>
          </div>

          <div id="main2-3">
            <p id="companion">동행</p>
            <p id="companion-content" th:text="*{companionText}"></p>
          </div>
        </div>

        <div class="right">
          <div id="main3">
            <div id="like">
              <button id="like-btn" th:data-review-id="*{id}">좋아요</button>
              <p id="like-count"></p>
            </div>
            <button id="share-btn">공유</button>
          </div>
        </div>
      </div>
      <div id="content">
        <p>장소 소개</p>
        <div class="content-1" th:text="*{content}"></div>
      </div>
    </div>

    <div id="main4" th:if="${nickname}">
      <div id="main4-1">
        <p id="nick1" th:text="${nickname}"></p>
        <p>님이 관심 있을만한 게시물</p>
      </div>
      <ul id="recommend-ul"></ul>
    </div>
    <div
      id="floating-btn"
      sec:authorize="hasAnyAuthority('ROLE_USER')"
      th:insert="~{fragment/floating_button::floating}"
    ></div>
    <div id="footer" th:insert="~{fragment/footer::footer}"></div>

    <template id="recommend-template">
      <li class="recommend-list">
        <a href="">
          <p>
            <img class="photo" />
          </p>
          <p class="title"></p>
          <p class="place"></p>
          <p class="hash"></p>
        </a>
      </li>
    </template>
    <script type="module" th:src="@{/js/review_detail.js}"></script>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/util.js}"></script>
  </body>
</html>
