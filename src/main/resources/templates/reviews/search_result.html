<!DOCTYPE html>
<html lang="ko" xmlns:sec="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <title>ICHITABI - 당신의 가장 좋았던 일본을 공유해주세요</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/reset.css}" />
    <link rel="stylesheet" th:href="@{/css/common.css}" />
    <link rel="stylesheet" th:href="@{/css/reviews_list.css}" />
  </head>

  <body>
    <div id="header" th:insert="~{fragment/header::header}"></div>
    <div id="wrapper">
      <div id="search-div">
        <h2 th:text="*{keyword}">'키워드'</h2>
        <h2>검색 결과 여행지 추천</h2>
      </div>
      <div id="review-div">
        <ul id="review-ul">
          <th:block th:replace="~{fragment/review_item_list :: reviewList(${reviewList})}">
          </th:block>
        </ul>
      </div>
    </div>
    <div
      id="floating-btn"
      sec:authorize="hasAnyAuthority('ROLE_USER')"
      th:insert="~{fragment/floating_button::floating}"
    ></div>
    <div id="footer" th:insert="~{fragment/footer::footer}"></div>
    <script type="module" th:src="@{/js/reviews_list.js}"></script>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/util.js}"></script>
    <script th:src="@{/js/header.js}"></script>
  </body>
</html>
