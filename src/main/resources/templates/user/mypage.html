<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>ICHITABI - 마이페이지</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
          href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap"
          rel="stylesheet"
  />

  <link rel="stylesheet" th:href="@{/css/reset.css}" />
  <link rel="stylesheet" th:href="@{/css/common.css}" />
  <link rel="stylesheet" th:href="@{/css/user.css}" />
</head>

<body>
<div id="header" th:insert="~{fragment/header::header}"></div>

<h2 id="title">마이페이지</h2>

<section id="mypage-container">

  <!-- 프로필 영역 -->
  <div class="profile-box">
    <div class="profile-img">
      <img
              th:src="${user.imgUrl != null ? user.imgUrl : '/images/default-profile.png'}"
              alt="프로필 이미지"
      />
    </div>
    <div class="profile-info">
      <p class="nickname" th:text="${user.nickname}"></p>
      <p class="email" th:text="${user.email}"></p>
    </div>
  </div>

  <!-- 유저 정보 -->
  <div class="info-box">
    <div class="info-row">
      <span class="label">생년월일</span>
      <span class="value" th:text="${user.birthday}"></span>
    </div>
    <div class="info-row">
      <span class="label">성별</span>
      <span class="value" th:text="${user.gender}"></span>
    </div>
  </div>

  <!-- 버튼 영역 -->
  <div class="mypage-btns">
    <a th:href="@{/user/mypage/edit}" class="mypage-btn">정보 수정</a>
  </div>

</section>

<div id="footer" th:insert="~{fragment/footer::footer}"></div>
</body>
</html>
