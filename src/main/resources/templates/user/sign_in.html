<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>ICHITABI - 로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
          href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap"
          rel="stylesheet"
  />
  <link rel="stylesheet" th:href="@{/css/reset.css}" />
  <link rel="stylesheet" th:href="@{/css/common.css}" />
  <link rel="stylesheet" th:href="@{/css/user.css}" />
</head>

<body>
<div id="header" th:insert="~{fragment/header :: header}"></div>

<h2 id="title">로그인</h2>

<div id="login-container">
  <form th:action="@{/user/login}" method="post">
    <input
            type="email"
            name="email"
            id="login-id"
            placeholder="이메일"
            required
    />
    <div class="error-msg" th:if="${error}" th:text="${error}"></div>
    <input
            type="password"
            name="pw"
            id="login-password"
            placeholder="비밀번호"
            required
    />
    <div class="checkbox-container">
      <label>
        <input type="checkbox" id="save-id" />
        <span class="checkbox-label">아이디 저장</span>
      </label>
    </div>
    <p th:if="${loginErrorMsg}" class="login-error" th:text="${loginErrorMsg}"></p>
    <button type="submit" class="loginBtn">로그인</button>
    <div class="links">
      <a th:href="@{/user/signup}">회원가입</a>
      <a href="#" id="open-modal">비밀번호 찾기</a>
    </div>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
  </form>
</div>

<!-- 비밀번호 찾기 모달 -->
<div id="pw-modal" class="modal">
  <div class="modal-content">
    <p>비밀번호 찾기 기능은 준비 중입니다.</p>
    <button id="close-modal">닫기</button>
  </div>
</div>

<div id="footer" th:insert="~{fragment/footer :: footer}"></div>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/user.js}"></script>
<script th:src="@{/js/util.js}"></script>
</body>
</html>
