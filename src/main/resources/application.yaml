spring:
  application:
    name: ichitabi

  devtools:
    livereload:
      enabled: true

  config:
    import: optional:classpath:application-env.properties

  datasource:
    driver-class-name: ${DB_DRIVER}
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5

  servlet:
    multipart:
      maxFileSize: 20MB
      maxRequestSize: 100MB

file:
  upload:
    itemImgLocation: src/main/resources/static/images/user
    uploadPath: src/main/resources/static/images/user


mybatis:
  mapper-locations: classpath:mapper/*.xml
  config-location: classpath:mybatis-config.xml